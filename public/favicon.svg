<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Рій БПЛА">
  <!-- Граф сусідства рою: п'ять апаратів і канали зв'язку між ними.
       Кольори — акцент і лінія з палітри курсу (style.css). -->
  <rect width="32" height="32" rx="7" fill="#3d4ec4"/>
  <g stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.55">
    <line x1="16" y1="8"  x2="8"  y2="14"/>
    <line x1="16" y1="8"  x2="24" y2="14"/>
    <line x1="8"  y1="14" x2="11" y2="24"/>
    <line x1="24" y1="14" x2="21" y2="24"/>
    <line x1="11" y1="24" x2="21" y2="24"/>
    <line x1="8"  y1="14" x2="24" y2="14"/>
  </g>
  <g fill="#ffffff">
    <circle cx="16" cy="8"  r="2.9"/>
    <circle cx="8"  cy="14" r="2.4"/>
    <circle cx="24" cy="14" r="2.4"/>
    <circle cx="11" cy="24" r="2.4"/>
    <circle cx="21" cy="24" r="2.4"/>
  </g>
</svg>
